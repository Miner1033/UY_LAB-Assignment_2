<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Calculator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .calculator-container {
            max-width: 320px;
            margin: 30px auto;
            text-align: center;
        }
        .calculator-heading {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #ff9500;
        }
        .calculator {
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            background-color: #1e1e1e;
        }
        .display {
            height: 70px;
            margin-bottom: 20px;
            text-align: right;
            font-size: 2.5rem;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #252525;
            color: #ffffff;
            overflow: hidden;
        }
        .btn-calc {
            height: 60px;
            font-size: 1.3rem;
            margin: 5px 0;
            border: none;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-calc:active {
            transform: scale(0.95);
        }
        .btn-number {
            background-color: #333;
            color: white;
        }
        .btn-number:hover {
            background-color: #444;
        }
        .btn-operator {
            background-color: #ff9500;
            color: white;
        }
        .btn-operator:hover {
            background-color: #ffaa33;
        }
        .btn-equals {
            background-color: #ff9500;
            color: white;
        }
        .btn-equals:hover {
            background-color: #ffaa33;
        }
        .btn-clear {
            background-color: #a5a5a5;
            color: black;
        }
        .btn-clear:hover {
            background-color: #bbbbbb;
        }
        .btn-utility {
            background-color: #a5a5a5;
            color: black;
        }
        .btn-utility:hover {
            background-color: #bbbbbb;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-heading">
            Assalamualaikum! Enter your numbers and operators to perform calculations
        </div>
        <div class="calculator">
            <div class="display" id="display">0</div>
            <div class="row">
                <div class="col-3">
                    <button class="btn btn-clear btn-calc w-100" onclick="clearDisplay()">AC</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-utility btn-calc w-100" onclick="toggleSign()">+/-</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-utility btn-calc w-100" onclick="appendToDisplay('%')">%</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-operator btn-calc w-100" onclick="appendToDisplay('/')">/</button>
                </div>
            </div>
            <div class="row">
                <div class="col-3">
                    <button class="btn btn-number btn-calc w-100" onclick="appendToDisplay('7')">7</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-number btn-calc w-100" onclick="appendToDisplay('8')">8</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-number btn-calc w-100" onclick="appendToDisplay('9')">9</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-operator btn-calc w-100" onclick="appendToDisplay('*')">×</button>
                </div>
            </div>
            <div class="row">
                <div class="col-3">
                    <button class="btn btn-number btn-calc w-100" onclick="appendToDisplay('4')">4</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-number btn-calc w-100" onclick="appendToDisplay('5')">5</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-number btn-calc w-100" onclick="appendToDisplay('6')">6</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-operator btn-calc w-100" onclick="appendToDisplay('-')">-</button>
                </div>
            </div>
            <div class="row">
                <div class="col-3">
                    <button class="btn btn-number btn-calc w-100" onclick="appendToDisplay('1')">1</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-number btn-calc w-100" onclick="appendToDisplay('2')">2</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-number btn-calc w-100" onclick="appendToDisplay('3')">3</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-operator btn-calc w-100" onclick="appendToDisplay('+')">+</button>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <button class="btn btn-number btn-calc w-100" onclick="appendToDisplay('0')">0</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-number btn-calc w-100" onclick="appendToDisplay('.')">.</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-equals btn-calc w-100" onclick="calculate()">=</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let currentDisplay = '0';
        let currentOperation = null;
        let previousValue = null;
        let resetDisplay = false;
        const display = document.getElementById('display');
        
        function updateDisplay() {
            display.textContent = currentDisplay;
        }
        
        function appendToDisplay(value) {
            if (currentDisplay === '0' && value !== '.' || resetDisplay) {
                currentDisplay = value;
                resetDisplay = false;
            } else {
                currentDisplay += value;
            }
            updateDisplay();
        }
        
        function clearDisplay() {
            currentDisplay = '0';
            currentOperation = null;
            previousValue = null;
            updateDisplay();
        }
        
        function toggleSign() {
            currentDisplay = currentDisplay.startsWith('-') ? 
                currentDisplay.substring(1) : '-' + currentDisplay;
            updateDisplay();
        }
        
        function calculate() {
            try {
                // Replace × with * for calculation
                let expression = currentDisplay.replace(/×/g, '*');
                // Handle percentage calculations
                expression = expression.replace(/(\d+)%/g, '($1/100)');
                currentDisplay = eval(expression).toString();
            } catch (error) {
                currentDisplay = 'Error';
            }
            updateDisplay();
            resetDisplay = true;
        }
        
        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
